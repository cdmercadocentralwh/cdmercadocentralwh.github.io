<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Links · CD Mercado Central</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Mismo look que la Team Room: fondo oscuro, tarjetas con brillo de color. */
:root{
  --bg:#050b16; --nav:#0d1728; --panel:#0b1424; --panel2:#101b2e;
  --line:#263958; --text:#edf5ff; --muted:#81a1d4; --dim:#5975a5;
  --cyan:#16dcf7; --green:#27e58a; --orange:#ff8c25; --amber:#ffc000; --violet:#a78bfa;
  --display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;min-height:100vh;
  background:radial-gradient(900px 500px at 85% -10%,#0e3a5c55,transparent 70%),var(--bg)}
header{display:flex;align-items:center;gap:14px;padding:14px 24px;background:var(--nav);border-bottom:1px solid #1d2d48}
header img{width:46px;height:46px;border-radius:50%;box-shadow:0 0 0 2px #d9efff33,0 0 18px #16dcf733}
header b{display:block;font-family:var(--display);font-weight:900;font-size:19px;letter-spacing:.06em;color:var(--cyan);line-height:1}
header small{display:block;font-size:11.5px;color:#6889be;letter-spacing:.06em;margin-top:3px}
main{max-width:1100px;margin:0 auto;padding:34px 24px 50px}
.head{display:flex;align-items:center;gap:18px;margin-bottom:26px}
.head .seal{width:64px;height:64px;border-radius:50%;border:2px solid #e8f3ff;object-fit:cover;flex:0 0 auto}
.eyebrow{font-family:var(--display);font-weight:700;font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
h1{margin:4px 0 0;font-family:var(--display);font-weight:900;font-size:clamp(34px,5vw,56px);line-height:1;letter-spacing:.03em;text-transform:uppercase}
h1 span{color:transparent;-webkit-text-stroke:1.5px var(--cyan)}
.sub{display:flex;align-items:center;gap:10px;margin:28px 0 12px;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.14em;color:var(--cyan);text-transform:uppercase}
.sub::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gl{--lc:var(--cyan);position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;gap:15px;min-height:96px;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:#cfe0fa;text-decoration:none;transition:transform .18s,border-color .18s,box-shadow .18s;min-width:0}
.gl::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.18;background:radial-gradient(circle at 12% 50%,var(--lc),transparent 36%)}
.gl::after{content:"";position:absolute;left:0;top:16%;bottom:16%;width:3px;border-radius:0 4px 4px 0;background:var(--lc);box-shadow:0 0 14px var(--lc)}
a.gl:hover,a.gl:focus-visible{border-color:var(--lc);transform:translateY(-2px);box-shadow:0 0 22px color-mix(in srgb,var(--lc) 28%,transparent);outline:none}
.gi{width:50px;height:50px;flex:0 0 50px;display:grid;place-items:center;border-radius:12px;border:1px solid color-mix(in srgb,var(--lc) 60%,transparent);background:color-mix(in srgb,var(--lc) 12%,transparent);color:var(--lc)}
.gi svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gl b{display:block;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.07em;text-transform:uppercase}
.gl b em{font-style:normal;color:var(--lc)}
.gl small{display:block;color:var(--muted);font-size:13px}
.arr{margin-left:auto;color:var(--lc);font-size:18px;flex:0 0 auto}
.gl.off{opacity:.5;border-style:dashed}
.gl.off small{color:var(--orange)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid #344a70;background:var(--panel2);color:#cfe0fa;font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.btn:hover{border-color:var(--cyan)}
.btn.solid{background:var(--cyan);border-color:var(--cyan);color:#04202a}
dialog{border:1px solid #344a70;border-radius:16px;background:var(--panel);color:var(--text);padding:22px;width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:#02060ccc;backdrop-filter:blur(3px)}
dialog h2{margin:0 0 4px;font-family:var(--display);font-size:22px;letter-spacing:.06em;text-transform:uppercase;color:#8baadd}
dialog p{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.lf{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.lf label{display:grid;gap:4px;font-family:var(--display);font-weight:700;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#6685b7}
.lf input{width:100%;min-height:40px;padding:0 12px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--text);font:inherit;font-size:14px;letter-spacing:0;text-transform:none}
.lf input:focus{outline:none;border-color:var(--cyan)}
.acts{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px}
.acts div{display:flex;gap:10px}
footer{margin-top:34px;color:var(--dim);font-size:12.5px;text-align:center;font-family:var(--display);letter-spacing:.14em;text-transform:uppercase}
@media (max-width:720px){.grid{grid-template-columns:1fr} main{padding:24px 16px 40px} header{padding:12px 16px} .head .seal{width:52px;height:52px}}
</style>
</head>

  <div id="secciones"></div>
  <dialog id="dlg"><form method="dialog">
    <h2>Editar enlaces</h2>
    <p>Cambiá el nombre o pegá el link de cada tarjeta. Se guarda en este navegador.</p>
    <div id="campos"></div>
    <div class="acts"><button class="btn" type="button" id="restaurar">Restaurar originales</button><div><button class="btn" value="cancel">Cancelar</button><button class="btn solid" type="button" id="guardar">Guardar</button></div></div>
  </form></dialog>
  <footer>CD Mercado Central · Warehouse</footer>
</main>
<script>
// Links de fábrica. Si "url" queda vacío, la tarjeta aparece como pendiente.
// Lo que se cambia con "Editar enlaces" se guarda en el navegador y pisa estos valores.
const SECCIONES = [
  { titulo: "Aplicaciones", links: [
    { id: "prod", t: "Mi Productividad", sub: "", d: "Productividad, ranking y ficha de cada operador", url: "https://indicadoresmc.github.io/app/", ico: "prod", c: "var(--amber)" },
    { id: "cal", t: "Rondas de Calidad", sub: "", d: "Conformidad y adherencia por sector", url: "https://rondascalidad-dmc.github.io/app/", ico: "cal", c: "var(--green)" },
    { id: "tr", t: "Diaria", sub: "| Team Room", d: "KPIs de la Diaria y arranque de turno", url: "https://diaria-teamroom.github.io/app/", ico: "tr", c: "var(--cyan)" },
    { id: "layout", t: "Layout del CD", sub: "", d: "Plano 3D de áreas y sectores", url: "https://claude.ai/artifact/V4LmHMBsawFTux6KzCNAjw", ico: "map", c: "var(--orange)" }
  ]},
  { titulo: "Power BI", links: [
    { id: "bi1", t: "Power BI", sub: "1", d: "", url: "", ico: "bi", c: "var(--amber)" },
    { id: "bi2", t: "Power BI", sub: "2", d: "", url: "", ico: "bi", c: "var(--amber)" }
  ]}
];
const ICO = {
  prod: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  cal: '<circle cx="12" cy="12" r="9"/><path d="M8.5 12.2l2.4 2.4 4.6-4.8"/>',
  tr: '<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4M7 13l3-3 3 2 4-4"/>',
  map: '<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/>',
  bi: '<rect x="4" y="12" width="4" height="8" rx="1"/><rect x="10" y="7" width="4" height="13" rx="1"/><rect x="16" y="3" width="4" height="17" rx="1"/>'
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const CLAVE = "links_cdmc_v1";
const $ = s => document.querySelector(s);
const leer = () => { try { return JSON.parse(localStorage.getItem(CLAVE)) || {}; } catch { return {}; } };
const escribir = v => { try { localStorage.setItem(CLAVE, JSON.stringify(v)); } catch {} };
const actual = l => ({ ...l, ...(leer()[l.id] || {}) });
const nombre = l => l.t + (l.sub ? " " + l.sub : "");

function render() {
  $("#secciones").innerHTML = SECCIONES.map(s => `<div class="sub">${esc(s.titulo)}</div><div class="grid">${s.links.map(x => {
    const l = actual(x), propio = l.nombre != null;
    const inner = `<span class="gi"><svg viewBox="0 0 24 24">${ICO[l.ico]}</svg></span><span><b>${propio ? esc(l.nombre) : `${esc(l.t)}${l.sub ? ` <em>${esc(l.sub)}</em>` : ""}`}</b><small>${l.url ? esc(l.d || "") : "Falta cargar el link · tocá Editar enlaces"}</small></span><span class="arr">↗</span>`;
    return l.url ? `<a class="gl" style="--lc:${l.c}" href="${esc(l.url)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="gl off" style="--lc:${l.c}">${inner}</div>`;
  }).join("")}</div>`).join("");
}

const todos = () => SECCIONES.flatMap(s => s.links);
$("#editar").onclick = () => {
  $("#campos").innerHTML = todos().map(x => { const l = actual(x);
    return `<div class="lf"><label>Nombre<input id="n_${x.id}" value="${esc(l.nombre ?? nombre(x))}"></label><label>Link<input type="url" id="u_${x.id}" value="${esc(l.url)}" placeholder="https://…"></label></div>`; }).join("");
  $("#dlg").showModal();
};
$("#guardar").onclick = () => {
  const v = {};
  todos().forEach(x => { const n = $("#n_" + x.id).value.trim(), u = $("#u_" + x.id).value.trim(), o = {};
    if (n && n !== nombre(x)) o.nombre = n;
    if (u !== x.url) o.url = u && !/^https?:\/\//i.test(u) ? "https://" + u : u;
    if (Object.keys(o).length) v[x.id] = o; });
  escribir(v); render(); $("#dlg").close();
};
$("#restaurar").onclick = () => { if (confirm("¿Volver a los nombres y links originales?")) { escribir({}); render(); $("#dlg").close(); } };
render();
</script>
</body>
</html>
